specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: CEPS (Centre for European Policy Studies)
providerId: ceps
publisherName: CEPS (Centre for European Policy Studies)
serviceCategory: API
created: '2026-05-04'
modified: '2026-05-04'
tags:
  - Brussels
  - Data Governance
  - EU Policy
  - European Union
  - Policy Research
  - Publications
  - RSS
  - Research
  - Think Tank
