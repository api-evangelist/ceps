description: >-
  Founded in Brussels in 1983, the Centre for European Policy Studies (CEPS)
  is a leading independent think tank and forum for debate on EU affairs,
  with an exceptionally strong in-house research capacity and an extensive
  network of partner institutes. CEPS conducts rigorous, evidence-based
  policy research on European and global issues (Data Governance Act, Data
  Act, AI Act, climate, migration, financial markets) and disseminates its
  findings primarily through publications, events, and podcasts rather than
  a commercial API; programmatic access to CEPS output is primarily via
  public RSS, OPML feeds, and structured publication pages on ceps.eu.
