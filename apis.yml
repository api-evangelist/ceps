        type: News
    description: >-
      CEPS exposes its publications and news stream as RSS/Atom feeds that
      aggregators, knowledge management tools, and policy-monitoring
      platforms can consume to track CEPS working papers, policy insights,
      reports, and commentaries as they are released.
