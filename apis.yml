description: >-
  Founded in Brussels in 1983, the Centre for European Policy Studies (CEPS)
  is a leading independent think tank and forum for debate on EU affairs,
  with strong in-house research capacity and an extensive network of partner
  institutes. CEPS conducts evidence-based policy research on European and
  global issues (Data Governance Act, Data Act, AI Act, climate, energy,
  migration, trade, defence, financial markets) and disseminates it through
  publications, events, task forces and podcasts rather than through any
  programmatic interface. CEPS publishes no API, SDK or developer program,
  and as of 2026-09-05 has no working machine-readable surface: the RSS feed
  this record once pointed at returns HTTP 500 ("No feed available") and is
  robots-disallowed, and no OpenAPI, AsyncAPI, GraphQL SDL, MCP server, A2A
  agent card or /.well-known/ document exists on any ceps.eu host. Following
  CEPS now means the newsletter or the HTML listings on ceps.eu.
apis:
  - aid: ceps:ceps-publications-feed
    name: CEPS Publications RSS / Content Feeds
    tags:
      - Content
      - Publications
      - Research Output
    humanURL: https://www.ceps.eu/ceps-publications/
    properties:
      - url: https://www.ceps.eu/ceps-publications/
        type: Website
      - url: https://www.ceps.eu/ceps-news/
        type: News
    description: >-
      CEPS publishes roughly 150 working papers, policy insights, reports and
      commentaries a year across some 20 policy topics, listed on the public
      publications page and filterable by topic. This entry was originally
      recorded because CEPS syndicated that stream as RSS/Atom, but the feed
      at https://www.ceps.eu/feed/ was probed on 2026-09-05 and returns HTTP
      500 with the WordPress body "No feed available, please visit the
      homepage!"; robots.txt additionally disallows /feed/ and /*/feed/. The
      dead RSS and Feed pointers have been removed rather than left standing
      as a claim CEPS no longer serves. What remains is an HTML listing with
      no machine-readable contract; see lifecycle/ceps-lifecycle.yml for the
      retirement record and the evidence behind it.
  - aid: ceps:ceps-events
    name: CEPS Events Listings
    tags:
      - Calendar
      - Event
      - Policy Forum
      - Webinars
    tags_raw:
      - Calendar
      - Events
      - Policy Forum
      - Webinars
    humanURL: https://www.ceps.eu/ceps-events/
    properties:
      - url: https://www.ceps.eu/ceps-events/
        type: Website
    description: >-
      CEPS maintains a public calendar of policy events, conferences, task
      force meetings, roundtables and webinars at /ceps-events/, filterable
      by event type and by upcoming/past state through query parameters. The
      listing is HTML only — there is no iCal, JSON or feed representation,
      and the /feed/ endpoint this entry previously pointed at now returns
      HTTP 500. The old /events/ path returns the site 404 template with no
      redirect and has been corrected here.
